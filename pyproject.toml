[project]
name = "emotionshift"
version = "0.1.0"
description = "Recognizing, anticipating and explaining emotional turning points in conversation (EE6405 group project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=4.45,<6"]
# B3 RoBERTa: uv sync --extra transformers
transformers = ["torch>=2.1", "transformers>=4.41", "accelerate>=0.26"]
# B2 BiGRU / BiLSTM: uv sync --extra rnn
rnn = ["torch>=2.4", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "notebook>=7.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "ty>=0.0.94",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emotionshift"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "C4"]

[tool.ruff.lint.per-file-ignores]
# Notebook setup may set the working directory before importing the package.
"*.ipynb" = ["E402"]
# Optional dependency checks must precede imports of the optional module.
"tests/test_torch_data.py" = ["E402"]
"tests/test_shiftaware.py" = ["E402"]
"tests/test_shiftaware_training.py" = ["E402"]

[tool.ty.src]
include = ["emotionshift", "scripts", "pilot", "tests", "notebooks"]

[tool.vulture]
paths = ["emotionshift", "scripts", "pilot", "tests"]
# Notebook calls, TypedDict keys and framework hooks produce lower-confidence findings.
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
