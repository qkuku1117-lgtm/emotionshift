[project]
name = "emotionshift"
version = "0.1.0"
description = "EE6405 group project: emotion shifts in conversation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# B3 RoBERTa (and the other transformer models): pip install -e ".[transformers]"
transformers = ["torch>=2.1", "transformers>=4.41", "accelerate>=0.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["emotionshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
