# Workstream 4: native EmoWOZ, utterance-only RoBERTa-base.
seeds: [0, 1, 2, 3, 4]
bootstrap: 1000
threads: 4
pretrained_repo: FacebookAI/roberta-base
pretrained_revision: e2da8e2f811d1448a5b465c236feacd80ffbac7b
model:
  epochs: 3
  lr: 1.0e-5
  batch_size: 32
  micro_batch_size: 4
  eval_batch_size: 8
  max_len: 128
  warmup: 0.1
  weight_decay: 0.01
  class_weight: null
  gradient_checkpointing: true
  select_on: weighted_f1_no_neutral
