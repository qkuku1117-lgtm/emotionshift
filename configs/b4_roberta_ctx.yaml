# B4: context-aware RoBERTa-base (Table 4 #5; proposal "Models", B4, E3).
# Input = the previous k turns with speaker names (past only) + the target, B3's recipe otherwise.
# k is chosen on DEV only: mean dev score over `sweep_seeds`; ties go to the smaller k.
# The test split is scored once per (k, seed) that ends up in the table.

datasets: [meld, dailydialog, emowoz]
seeds: [0, 1, 2, 3, 4]        # final rows (proposal R4 >= 3, E1 uses 5)
sweep_seeds: [0, 1, 2]        # seeds used to pick k; they are reused as seeds 0-2 of the final rows
bootstrap: 1000

model:
  model_name: roberta-base
  lr: 1.0e-5
  batch_size: 32
  max_len: 256                # B3 uses 128 for one utterance; history needs room (cut on the left)
  warmup: 0.1
  weight_decay: 0.01
  class_weight: null          # plain CE; B4+ = --class-weight balanced --tag b4plus

epochs:
  meld: 4
  dailydialog: 3
  emowoz: 4

select_on:
  meld: weighted_f1
  dailydialog: micro_f1_no_neutral
  emowoz: weighted_f1_no_neutral

test_splits:
  meld: [test]
  dailydialog: [test_dedup, test]
  emowoz: [test]

# E3 window sweep. "all" = the whole past. A dataset with `k_from` reuses another dataset's chosen k
# (saves ~10 GPU hours); `controls` are extra k values trained for all seeds and reported beside the
# chosen k (k=0 is B3's input; EmoWOZ has no B3 yet, so its control is trained here).
sweep:
  meld: {grid: [1, 3, 5, 10, all]}
  dailydialog: {k_from: meld}
  emowoz: {grid: [1, 3, 5, 10], controls: [0]}

# Baseline for the delta in summary.json: B3's prediction files (predictions/b3_*) if present,
# otherwise the k = 0 control trained here.
baseline_prefix: b3
